<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload History - Network Attack Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .card {
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: none;
            margin-bottom: 20px;
        }
        .table-hover tbody tr {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Network Attack Detector by PCAP File</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard"><i class="fas fa-home"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/history"><i class="fas fa-history"></i> History</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="fas fa-upload"></i> New Upload</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-history me-2"></i>Analysis History</h2>
            <button class="btn btn-primary" onclick="window.location.href='/'">
                <i class="fas fa-plus me-1"></i> New Analysis
            </button>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover" id="historyTable">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Upload Time</th>
                                <th>Filename</th>
                                <th>Size</th>
                                <th>Packets</th>
                                <th>Alerts</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="historyBody">
                            <tr>
                                <td colspan="8" class="text-center py-4">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                    <p class="mt-2 text-muted">Loading history...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p class="mb-0">&copy; <span id="currentYear"></span> Created by Desta Fauzi Hariyanto</p>
        </div>
    </footer>
    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetchHistory();
        });

        function fetchHistory() {
            fetch('/api/db/history')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('historyBody');
                    tbody.innerHTML = '';

                    if (data.status === 'success' && data.data.length > 0) {
                        data.data.forEach(item => {
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td>#${item.id}</td>
                                <td>${item.upload_time}</td>
                                <td>${item.filename.split('_').slice(2).join('_')}</td> <!-- Remove timestamp prefix for display -->
                                <td>${item.file_size}</td>
                                <td>${item.total_packets.toLocaleString()}</td>
                                <td>
                                    <span class="badge ${item.malicious_packets > 0 ? 'bg-danger' : 'bg-success'}">
                                        ${item.malicious_packets} Alerts
                                    </span>
                                </td>
                                <td>
                                    <span class="badge bg-info">${item.status}</span>
                                </td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary" onclick="viewReport(${item.id})">
                                        <i class="fas fa-eye"></i> View Report
                                    </button>
                                </td>
                            `;
                            tbody.appendChild(tr);
                        });
                    } else if (data.status === 'error') {
                        tbody.innerHTML = `<tr><td colspan="8" class="text-center text-danger">Error: ${data.message}</td></tr>`;
                    } else {
                        tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted">No history found. Upload a file to get started.</td></tr>`;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('historyBody').innerHTML = 
                        `<tr><td colspan="8" class="text-center text-danger">Failed to load history. Is the database connected?</td></tr>`;
                });
        }

        function viewReport(id) {
            // Redirect to dashboard with report ID parameter
            window.location.href = `/dashboard?report_id=${id}`;
        }
    </script>
</body>
</html>
